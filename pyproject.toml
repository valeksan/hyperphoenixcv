[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperphoenixcv"
version = "0.6.0"
description = "Hyper-parameter search with resumable SQLite studies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "valeksan", email = "vitaljax001@gmail.com"},
]
keywords = ["hyperparameter tuning", "grid search", "SQLite", "machine learning", "scikit-learn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  # Windows durability behavior is not yet covered by CI.
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy>=1.21.6",
  # ``cross_validate(..., params=...)`` is part of evaluator contract.
  "scikit-learn>=1.4.0",
  "pandas>=1.5.0",
  "joblib>=1.3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-cov>=4",
]
optuna = [
  "optuna>=3.0",
]
parquet = [
  "pyarrow>=10",
]

[project.urls]
"Bug Tracker" = "https://github.com/valeksan/hyperphoenixcv/issues"
"Source Code" = "https://github.com/valeksan/hyperphoenixcv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: durability/performance coverage",
]
