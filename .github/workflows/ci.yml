name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'verify_library.py'
      - 'README.md'
      - 'README_RU.md'
      - 'examples/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'verify_library.py'
      - 'README.md'
      - 'README_RU.md'
      - 'examples/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]' build

    - name: Run tests with pytest
      run: |
        python -m pytest -q

    - name: Compile package and tests
      run: python -m compileall -q src tests

    - name: Run verification script
      run: |
        python verify_library.py

    - name: Compile examples
      run: python -m compileall -q examples

    - name: Build wheel and install it cleanly
      run: |
        python -m build
        python -m venv /tmp/hyperphoenixcv-wheel-env
        /tmp/hyperphoenixcv-wheel-env/bin/python -m pip install dist/*.whl
        /tmp/hyperphoenixcv-wheel-env/bin/python -c "import hyperphoenixcv; assert hyperphoenixcv.__version__ == '0.4.1'"
