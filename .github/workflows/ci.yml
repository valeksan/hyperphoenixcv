name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'verify_library.py'
      - 'README.md'
      - 'README_RU.md'
      - 'docs/**/*.md'
      - 'local_docs/**/*.md'
      - 'examples/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'verify_library.py'
      - 'README.md'
      - 'README_RU.md'
      - 'docs/**/*.md'
      - 'local_docs/**/*.md'
      - 'examples/**/*.py'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        dependency-set: ["minimum", "latest"]
        exclude:
          # Minimum dependency wheels target Python 3.10.
          - python-version: "3.11"
            dependency-set: "minimum"
          - python-version: "3.12"
            dependency-set: "minimum"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]' build
        if [ "${{ matrix.dependency-set }}" = "minimum" ]; then
          python -m pip install --force-reinstall \
            'numpy==1.21.6' 'scipy==1.10.1' 'pandas==1.5.0' 'joblib==1.3.2' 'scikit-learn==1.4.0'
        fi

    - name: Run tests with pytest
      run: |
        python -m pytest -q

    - name: Compile package and tests
      run: python -m compileall -q src tests

    - name: Run verification script
      run: |
        python verify_library.py

    - name: Compile examples
      run: python -m compileall -q examples

  optuna:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install core and optional dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[optuna,test]'

    - name: Run Optuna suite
      run: python -m pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Build wheel and smoke test clean install
      run: |
        python -m pip install --upgrade pip build
        python -m build
        python -m venv /tmp/hyperphoenixcv-wheel-env
        PYTHON=/tmp/hyperphoenixcv-wheel-env/bin/python
        $PYTHON -m pip install --upgrade pip
        $PYTHON -m pip install dist/*.whl
        $PYTHON - <<'PY'
        import tempfile
        from pathlib import Path

        from sklearn.datasets import load_iris
        from sklearn.linear_model import LogisticRegression
        from hyperphoenixcv import HyperPhoenixCV

        X, y = load_iris(return_X_y=True)
        path = Path(tempfile.mkdtemp()) / "study.sqlite"
        kwargs = dict(
            estimator=LogisticRegression(max_iter=200),
            search_space={"C": [0.1]},
            strategy="grid",
            scoring="accuracy",
            cv=2,
            storage_path=path,
            dataset_id="wheel-smoke-iris-v1",
        )
        first = HyperPhoenixCV(**kwargs).fit(X, y)
        resumed = HyperPhoenixCV(**kwargs, resume="must").fit(X, y)
        assert len(first.cv_results_["params"]) == 1
        assert len(resumed.cv_results_["params"]) == 1
        PY

  wheel-optuna-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Build wheel and smoke test clean Optuna install
      run: |
        python -m pip install --upgrade pip build
        python -m build
        python -m venv /tmp/hyperphoenixcv-optuna-wheel-env
        PYTHON=/tmp/hyperphoenixcv-optuna-wheel-env/bin/python
        WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
        $PYTHON -m pip install --upgrade pip
        $PYTHON -m pip install "${WHEEL}[optuna]"
        $PYTHON - <<'PY'
        import tempfile
        from pathlib import Path

        import optuna
        from sklearn.datasets import load_iris
        from sklearn.linear_model import LogisticRegression
        from hyperphoenixcv import HyperPhoenixCV

        X, y = load_iris(return_X_y=True)
        study = Path(tempfile.mkdtemp()) / "optuna.sqlite3"
        search = HyperPhoenixCV(
            estimator=LogisticRegression(max_iter=200),
            strategy="optuna",
            search_space={"C": optuna.distributions.FloatDistribution(0.1, 1.0)},
            n_trials=1,
            scoring="accuracy",
            cv=2,
            storage_path=study,
            dataset_id="wheel-optuna-smoke-iris-v1",
        ).fit(X, y)
        assert len(search.cv_results_["params"]) == 1
        PY

  artifact-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Build and inspect artifacts
      run: |
        python -m pip install --upgrade pip build
        python -m build
        python - <<'PY'
        import zipfile
        from pathlib import Path

        wheel = next(Path("dist").glob("*.whl"))
        with zipfile.ZipFile(wheel) as archive:
            names = set(archive.namelist())
        assert "hyperphoenixcv/__init__.py" in names
        assert "hyperphoenixcv/core.py" in names
        assert "hyperphoenixcv/storage/sqlite_store.py" in names
        assert any(name.endswith("METADATA") for name in names)
        assert not any("tests/" in name or "local_docs/" in name for name in names)
        assert len(list(Path("dist").glob("*.tar.gz"))) == 1
        PY
